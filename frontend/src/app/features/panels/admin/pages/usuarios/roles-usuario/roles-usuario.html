<ui-modal
  [abierto]="usuario() !== null"
  titulo="Roles del usuario"
  [subtitulo]="usuario()?.usuario ?? ''"
  (cerrar)="cerrarModal()"
>
  <p class="modal-hint">
    Activa los roles que quieras asignar a este usuario. Sus permisos se heredan de los roles
    activados.
  </p>
  @if (cargando()) {
    <div class="loading"><span class="ui-spinner"></span> Cargando roles…</div>
  } @else if (error()) {
    <ui-empty icono="alerta" titulo="No se pudo cargar" [mensaje]="error()!" />
  } @else if (catalogo().length === 0) {
    <ui-empty icono="roles" titulo="Sin roles" mensaje="No hay roles creados en el sistema." />
  } @else {
    <app-lista-asignacion
      icono="shieldCheck"
      [items]="catalogo()"
      [asignados]="asignados()"
      [cambiando]="cambiando()"
      (alternar)="alternar($event)"
    />
  }
  <div modal-footer class="modal-foot">
    <button type="button" class="ui-btn ui-btn--primary" (click)="cerrarModal()">Listo</button>
  </div>
</ui-modal>
