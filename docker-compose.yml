# ============================================================
# Stack LOCAL completo (opcional): PostgreSQL 17 + la misma imagen que Render.
#
#   docker compose up --build
#   -> app en http://localhost:10000  (health: /api/health)
#
# - PostgreSQL aplica backend/postgresql.sql al crearse el volumen.
#   backend/datos.sql (ejemplos de Bitácora) va DESPUÉS del primer arranque
#   del backend (necesita el usuario semilla). Ver README > Base de datos.
# - Secretos (JWT_SECRET, USER_*) se leen de backend/.env si existe; la
#   conexión se fuerza al bloque LOCAL apuntando al PostgreSQL del compose.
# ============================================================
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ingenieria_logistica
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local}
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/postgresql.sql:/docker-entrypoint-initdb.d/01-postgresql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d ingenieria_logistica"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "10000"
      BACKEND_PORT: "2003"
      DB_CONEXION: LOCAL
      DB_LOCAL_HOST: postgres
      DB_LOCAL_PORT: "5432"
      DB_LOCAL_NAME: ingenieria_logistica
      DB_LOCAL_USER: atlas
      DB_LOCAL_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local}
      DB_LOCAL_SSLMODE: disable
      CORS_ALLOWED_ORIGINS: http://localhost:10000
    ports:
      - "10000:10000"

volumes:
  postgres-data:
