spring.application.name=backend

# Las credenciales se cargan desde .env con DotenvEnvironmentPostProcessor
# (valores crudos). Se pueden sobrescribir con variables de entorno o
# argumentos --spring... sin tocar este archivo.

server.port=${BACKEND_PORT:2003}

# Detras del proxy de nginx (mismo contenedor): confia en X-Forwarded-*.
# Sin esto, getRemoteAddr() siempre seria 127.0.0.1 y el rate-limit de login
# por IP queda inutil (cubo unico compartido por todos los clientes).
server.forward-headers-strategy=native

# ============================================
# Datasource PostgreSQL (conexiones multiples)
# URL, usuario y clave los arma ConexionBaseDatos con las variables de
# entorno: DB_CONEXION elige el bloque activo (DB_NUBE_*, DB_LOCAL_*, ...).
# El esquema se instala con backend/postgresql.sql (NO con Hibernate).
# ============================================
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool fijo (tamano: DB_<NOMBRE>_POOL). Si en 3 s no hay conexion libre se
# responde 503 en lugar de encolar la peticion indefinidamente.
spring.datasource.hikari.pool-name=atlas
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000
# Avisa en el log si una conexion se retiene mas de 30 s (fuga o consulta lenta).
spring.datasource.hikari.leak-detection-threshold=30000

# ============================================
# JPA / Hibernate
# ============================================
# El esquema lo instala backend/postgresql.sql; Hibernate solo VALIDA al arrancar
# que cada entidad coincida con su tabla (si no, la app no arranca y lo dice).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Las sentencias nativas se escriben para PostgreSQL; el dialecto se detecta
# del driver, pero se fija para que el arranque no dependa de los metadatos.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Zona horaria del negocio: solo para saber qué día es "hoy" (ZonaNegocio).
# La auditoría se guarda en UTC y el frontend la muestra en esta zona.
app.zona-horaria=${APP_ZONA_HORARIA:America/Lima}
# Timeout de sentencia JDBC en segundos: evita que una query colgada retenga
# una conexion del pool indefinidamente.
spring.jpa.properties.hibernate.jdbc.timeout=${DB_QUERY_TIMEOUT_S:5}
# Batching para inserts/updates en lote.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# Rendimiento / concurrencia (~1000 req/s)
# ============================================
spring.threads.virtual.enabled=true
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=200
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20s

# Excel de simulación: los libros con muchas rutas superan el límite por defecto de 1 MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Apagado ordenado: deja terminar las peticiones en vuelo (SIGTERM de Render).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================
# Seguridad: JWT (el secreto vive en .env como JWT_SECRET)
# ============================================
app.jwt.secret=${JWT_SECRET}
# Access token corto: el navegador lo renueva con el refresh token sin pedir la contrasena.
app.jwt.ttl-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.issuer=${JWT_ISSUER:hehiachi-mishima}
# Refresh token (cookie HttpOnly): vence tras REFRESH_INACTIVIDAD_S sin uso y,
# aunque haya actividad, a los REFRESH_MAXIMO_S de iniciar sesion (un turno).
app.auth.refresh.inactividad-s=${REFRESH_INACTIVIDAD_S:7200}
app.auth.refresh.maximo-s=${REFRESH_MAXIMO_S:43200}
app.auth.refresh.cookie=atlas_refresh
# Solo false para probar sin HTTPS fuera de localhost.
app.auth.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:true}

# ============================================
# CORS (frontend Angular). Lista separada por comas.
# En desarrollo Angular corre en http://localhost:4200.
# Sobrescribible con CORS_ALLOWED_ORIGINS en .env / entorno.
# ============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cors.max-age=3600

# Elimina el usuario/password generado por Spring Security (sin bypass por defecto)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# No filtrar detalles internos en las respuestas de error
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# ============================================
# Usuario semilla: se crea al arrancar si no existe (credenciales en .env)
# ============================================
app.seed.usuario=${USER_ADMIN}
app.seed.contrasena=${USER_PASSWORD}
app.seed.nombre=${USER_NAME}
app.seed.apellido=${USER_LASTNAME}
app.seed.email=${USER_EMAIL}
app.seed.telefono=${USER_PHONE}
app.seed.rol=${USER_ROL}
app.seed.activo=${USER_ACTIVO}

# ============================================
# Observabilidad (Actuator + Micrometer/Prometheus)
# /actuator/health es publico; prometheus queda detras de autenticacion.
# ============================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.metrics.tags.application=farmacias-peruanas-backend
# Histogramas de latencia por endpoint: permiten calcular p95/p99 en Prometheus
# (histogram_quantile) y contar cuántas peticiones cumplen cada SLO.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,200ms,500ms,1s
info.app.name=farmacias-peruanas-backend
info.app.description=Plataforma de control de accesos

# ============================================
# Cache en memoria (Caffeine)
# ============================================
# Autoridades/permisos por usuario: elimina 2 queries SQL por request.
# TTL corto + invalidacion explicita al asignar/quitar rol o permiso.
app.security.permission-cache.enabled=${PERMISSION_CACHE_ENABLED:true}
app.security.permission-cache.ttl-ms=${PERMISSION_CACHE_TTL_MS:30000}
app.security.permission-cache.max-size=${PERMISSION_CACHE_MAX:10000}
# Estadisticas de dashboard (evita 5 agregaciones full-table por request).
app.stats-cache.enabled=${STATS_CACHE_ENABLED:true}
app.stats-cache.ttl-ms=${STATS_CACHE_TTL_MS:60000}
app.stats-cache.max-size=${STATS_CACHE_MAX:500}
# Refresco programado de la cache de catalogos (evita recarga en el request).
app.catalogo.cache.refresh-ms=${CATALOGO_REFRESH_MS:300000}


# Panel Picking: archivo del WMS por SFTP (variables del .env). Todo con valor
# por defecto: sin SFTP configurado el backend arranca y el panel usa el archivo
# que ya esté en la carpeta.
sftp.host=${SFTP_HOST:}
sftp.port=${SFTP_PORT:22}
sftp.username=${SFTP_USER:}
sftp.password=${SFTP_PASSWORD:}
sftp.remote-directory=${SFTP_REMOTE_DIR:}
sftp.filename=${SFTP_FILENAME:Data_P_TITAN_RDC.csv}
# Línea de known_hosts del servidor ("host ecdsa-sha2-nistp256 AAAA..."): verifica su identidad.
sftp.known-hosts=${SFTP_KNOWN_HOSTS:}
# Carpeta con el único archivo del panel (relativa al directorio de trabajo del backend).
picking.data-dir=${SFTP_LOCAL_DIR:data}
# Devtools (solo en local): la carpeta de datos no reinicia la app aunque cambie el archivo.
spring.devtools.restart.additional-exclude=data/**,**/picking/data/**
# Revisión del servidor (hora de Lima): por defecto a los :05 y :35 de cada hora.
picking.sync.cron=${PICKING_SYNC_CRON:0 5,35 * * * *}
picking.sync.timeout-ms=${PICKING_SYNC_TIMEOUT_MS:30000}

# Logs del SFTP: INFO en producción; DEBUG solo para diagnosticar (SFTP_LOG_LEVEL=DEBUG).
logging.level.org.springframework.integration.sftp=${SFTP_LOG_LEVEL:INFO}
logging.level.org.springframework.integration.file=${SFTP_LOG_LEVEL:INFO}
