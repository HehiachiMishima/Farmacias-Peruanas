spring.application.name=backend

# Las credenciales se cargan desde .env con DotenvEnvironmentPostProcessor
# (valores crudos). Se pueden sobrescribir con variables de entorno o
# argumentos --spring... sin tocar este archivo.

server.port=${BACKEND_PORT:2003}

# Detras del proxy de nginx (mismo contenedor): confia en X-Forwarded-*.
# Sin esto, getRemoteAddr() siempre seria 127.0.0.1 y el rate-limit de login
# por IP queda inutil (cubo unico compartido por todos los clientes).
server.forward-headers-strategy=native

# ============================================
# Datasource MySQL (doble conexion conmutable)
# El esquema se gestiona con backend/schema.sql (NO con Hibernate).
# Los parametros de conexion vienen de DB_PARAMS en .env, de modo que
# basta comentar/descomentar un bloque del .env para alternar entre
# MySQL local y Aiven sin tocar este archivo.
# ============================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?${DB_PARAMS:serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool dimensionado para alta concurrencia (~1000 req/s con consultas PK cortas)
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Timeout de sentencia JDBC en segundos: evita que una query colgada retenga
# una conexion del pool indefinidamente.
spring.jpa.properties.hibernate.jdbc.timeout=${DB_QUERY_TIMEOUT_S:5}
# Batching para inserts/updates en lote.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# Rendimiento / concurrencia (~1000 req/s)
# ============================================
spring.threads.virtual.enabled=true
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=200
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20s

# Apagado ordenado: deja terminar las peticiones en vuelo (SIGTERM de Render).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Timeout de las respuestas asincronas (los controllers devuelven Mono).
spring.mvc.async.request-timeout=15s

# ============================================
# Seguridad: JWT (el secreto vive en .env como JWT_SECRET)
# ============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=${JWT_ISSUER:hehiachi-mishima}

# ============================================
# CORS (frontend Angular). Lista separada por comas.
# En desarrollo Angular corre en http://localhost:4200.
# Sobrescribible con CORS_ALLOWED_ORIGINS en .env / entorno.
# ============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cors.max-age=3600

# Elimina el usuario/password generado por Spring Security (sin bypass por defecto)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# No filtrar detalles internos en las respuestas de error
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# ============================================
# Usuario semilla: se crea al arrancar si no existe (credenciales en .env)
# ============================================
app.seed.usuario=${USER_ADMIN}
app.seed.contrasena=${USER_PASSWORD}
app.seed.nombre=${USER_NAME}
app.seed.apellido=${USER_LASTNAME}
app.seed.email=${USER_EMAIL}
app.seed.telefono=${USER_PHONE}
app.seed.rol=${USER_ROL}
app.seed.activo=${USER_ACTIVO}

# ============================================
# Observabilidad (Actuator + Micrometer/Prometheus)
# /actuator/health es publico; prometheus queda detras de autenticacion.
# ============================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.metrics.tags.application=farmacias-peruanas-backend
info.app.name=farmacias-peruanas-backend
info.app.description=Plataforma de control de accesos

# ============================================
# Cache en memoria (Caffeine)
# ============================================
# Autoridades/permisos por usuario: elimina 2 queries SQL por request.
# TTL corto + invalidacion explicita al asignar/quitar rol o permiso.
app.security.permission-cache.enabled=${PERMISSION_CACHE_ENABLED:true}
app.security.permission-cache.ttl-ms=${PERMISSION_CACHE_TTL_MS:30000}
app.security.permission-cache.max-size=${PERMISSION_CACHE_MAX:10000}
# Estadisticas de dashboard (evita 5 agregaciones full-table por request).
app.stats-cache.enabled=${STATS_CACHE_ENABLED:true}
app.stats-cache.ttl-ms=${STATS_CACHE_TTL_MS:60000}
app.stats-cache.max-size=${STATS_CACHE_MAX:500}
# Refresco programado de la cache de catalogos (evita recarga en el request).
app.catalogo.cache.refresh-ms=${CATALOGO_REFRESH_MS:300000}
