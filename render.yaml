# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# ============================================================
# Blueprint de Render (infraestructura como codigo).
# UN solo servicio web a partir del Dockerfile de la raiz, que
# ya incluye el frontend (Angular + nginx) y el backend (Spring Boot).
#
# Pasos para desplegar:
#   1. Sube el repositorio a GitHub/GitLab.
#   2. En Render: New + > Blueprint > selecciona el repositorio.
#   3. Render pedira los valores marcados con "sync: false"
#      (credenciales de la base de datos, datos del administrador y la
#      contrasena del SFTP del panel Picking).
# ============================================================

services:
  - type: web
    name: ingenieria-logistica
    runtime: docker
    plan: free
    region: oregon
    branch: ingenieria_logistica
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Puerto publico que expone nginx (el backend usa el 2003 interno).
      - key: PORT
        value: "10000"
      - key: BACKEND_PORT
        value: "2003"

      # --- Base de datos PostgreSQL (se solicita al crear el Blueprint) ---
      # DB_CONEXION elige el bloque DB_<NOMBRE>_*. En Render basta la URL de
      # la base (Internal Database URL): postgresql://usuario:clave@host/base
      - key: DB_CONEXION
        value: "NUBE"
      - key: DB_NUBE_URL
        sync: false
      - key: DB_NUBE_SSLMODE
        value: "require"

      # --- Seguridad ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: "ingenieria-logistica"
      # SPA y API comparten origen (nginx), asi que CORS no interviene en el
      # navegador. Si sirves el frontend desde otro dominio, ponlo aqui:
      # p. ej. https://ingenieria-logistica.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # --- JVM (opcional): ajusta memoria sin reconstruir la imagen ---
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"

      # --- Panel Picking: archivo del WMS por SFTP ---
      # La imagen no incluye el CSV (backend/data no se copia al contenedor).
      # Al arrancar, el backend descarga el archivo del WMS y lo guarda en
      # SFTP_LOCAL_DIR; la carpeta es efimera en Render, pero se vuelve a
      # sincronizar en cada arranque (y a los :05 y :35 de cada hora).
      - key: SFTP_HOST
        value: "40.77.63.163"
      - key: SFTP_PORT
        value: "22"
      - key: SFTP_USER
        value: "supply"
      - key: SFTP_PASSWORD
        sync: false
      - key: SFTP_REMOTE_DIR
        value: "/wms_prd/data/9040/output/REPORT_AUTO/"
      - key: SFTP_FILENAME
        value: "Pedidos + Asignación 9040.csv"
      - key: SFTP_LOCAL_DIR
        value: "/app/data"
      # Opcional pero recomendado: linea known_hosts ("host clave-publica")
      # para verificar la identidad del servidor. Si falta, el backend acepta
      # cualquier clave. Descomenta y define el valor en el dashboard.
      # - key: SFTP_KNOWN_HOSTS
      #   sync: false

      # --- Usuario administrador semilla ---
      - key: USER_ADMIN
        sync: false
      - key: USER_PASSWORD
        sync: false
      - key: USER_NAME
        sync: false
      - key: USER_LASTNAME
        sync: false
      - key: USER_EMAIL
        sync: false
      - key: USER_PHONE
        sync: false
      - key: USER_ACTIVO
        value: "TRUE"
      - key: USER_ROL
        value: "ADMINISTRADOR"
